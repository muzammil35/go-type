<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .status.connecting {
            background: #fff3cd;
            color: #856404;
        }

        .text-display {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            min-height: 120px;
            font-size: 1.3em;
            line-height: 1.8;
            border: 2px solid #e9ecef;
            position: relative;
        }

        .text-display:focus {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }

        .text-display.empty {
            color: #999;
            font-style: italic;
        }

        .char {
            display: inline;
        }

        .char.pending {
            color: #999;
        }

        .char.correct {
            color: #333;
        }

        .char.incorrect {
            color: #dc3545;
            background: #ffe6e6;
        }

        .char.current {
            position: relative;
        }

        .char.current::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 2px;
            background: #667eea;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .reconnect-btn {
            display: block;
            margin: 20px auto 0;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .reconnect-btn:hover {
            background: #5568d3;
        }

        .reconnect-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .instructions {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⌨️ Typing Test</h1>
        
        <div id="status" class="status connecting">Connecting to server...</div>


        <div id="textDisplay" class="text-display empty" tabindex="0">
            Waiting for text from server...
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Accuracy</div>
                <div class="stat-value" id="accuracy">0%</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Characters</div>
                <div class="stat-value" id="progress">0/0</div>
            </div>
        </div>

        <button id="reconnectBtn" class="reconnect-btn" style="display: none;">Reconnect</button>
    </div>

    <script>
        let ws;
        let targetText = '';
        let userText = '';
        let isEnabled = false;
        
        const statusEl = document.getElementById('status');
        const textDisplayEl = document.getElementById('textDisplay');
        const accuracyEl = document.getElementById('accuracy');
        const progressEl = document.getElementById('progress');
        const reconnectBtn = document.getElementById('reconnectBtn');

        function connect() {
            statusEl.className = 'status connecting';
            statusEl.textContent = 'Connecting to server...';
            reconnectBtn.style.display = 'none';

            ws = new WebSocket('ws://localhost:8080/ws');

            ws.onopen = () => {
                statusEl.className = 'status connected';
                statusEl.textContent = '✓ Connected to server';
                isEnabled = true;
                textDisplayEl.focus();
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                console.log(message);
                
                switch (message.type) {
                    case "wait_message":
                        console.log("change text");
                        statusEl.textContent = 'Waiting to be matched to opponent';
                        break;
                    case "game_start":
                        const startUnix = message.start_at; // Unix timestamp in seconds
                    
                        // Convert Unix timestamp to JS Date
                        const startTime = new Date(startUnix * 1000); // JS Date uses milliseconds

                        // Calculate the delay until start
                        const now = new Date();
                        const delay = startTime - now; // difference in milliseconds

                        if (delay <= 0) {
                            // Already past start time, start immediately
                            startGame(text);
                        } else {
                            // Schedule start at the correct time
                            setTimeout(() => startGame(text), delay);
                        }
                        targetText = message.text;
                        userText = '';
                        textDisplayEl.className = 'text-display';
                        renderText();
                        updateStats();
                        textDisplayEl.focus();
                        statusEl.textContent = 'Game Started, start typing!'
                        break;
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                statusEl.className = 'status disconnected';
                statusEl.textContent = '✗ Disconnected from server';
                isEnabled = false;
                reconnectBtn.style.display = 'block';
            };
        }

        function renderText() {
            if (!targetText) {
                textDisplayEl.className = 'text-display empty';
                textDisplayEl.textContent = 'Waiting for text from server...';
                return;
            }

            let html = '';
            for (let i = 0; i < targetText.length; i++) {
                const targetChar = targetText[i];
                const userChar = userText[i];
                
                let className = 'char pending';
                if (i === userText.length) {
                    className = 'char pending current';
                } else if (userChar !== undefined) {
                    className = userChar === targetChar ? 'char correct' : 'char incorrect';
                }
                
                html += `<span class="${className}">${targetChar === ' ' ? '&nbsp;' : targetChar}</span>`;
            }
            
            textDisplayEl.innerHTML = html;
        }

        function updateStats() {
            if (!targetText) {
                accuracyEl.textContent = '0%';
                progressEl.textContent = '0/0';
                return;
            }

            let correct = 0;
            for (let i = 0; i < userText.length; i++) {
                if (userText[i] === targetText[i]) {
                    correct++;
                }
            }

            const accuracy = userText.length > 0 ? Math.round((correct / userText.length) * 100) : 0;
            accuracyEl.textContent = accuracy + '%';
            progressEl.textContent = `${userText.length}/${targetText.length}`;
        }

        // Handle keyboard input
        textDisplayEl.addEventListener('keydown', (e) => {
            if (!isEnabled || !targetText) return;

            // Prevent default for most keys to avoid unwanted behavior
            if (e.key.length === 1 || e.key === 'Backspace') {
                e.preventDefault();
            }

            if (e.key === 'Backspace') {
                // Remove last character
                if (userText.length > 0) {
                    userText = userText.slice(0, -1);
                    renderText();
                    updateStats();
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(userText);
                    }
                }
            } else if (e.key.length === 1 && userText.length < targetText.length) {
                // Add character (only printable characters)
                userText += e.key;
                renderText();
                updateStats();

                // Send the current typed text to the server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(userText);
                }

                // Check if completed
                if (userText.length === targetText.length) {
                    let allCorrect = true;
                    for (let i = 0; i < targetText.length; i++) {
                        if (userText[i] !== targetText[i]) {
                            allCorrect = false;
                            break;
                        }
                    }
                    
                    if (allCorrect) {
                        setTimeout(() => {
                            alert('Great job! You completed the text perfectly! 🎉');
                        }, 100);
                    }
                }
            }
        });

        // Make sure the text display stays focused
        textDisplayEl.addEventListener('blur', () => {
            if (isEnabled && targetText) {
                setTimeout(() => textDisplayEl.focus(), 0);
            }
        });

        // Click to focus
        textDisplayEl.addEventListener('click', () => {
            textDisplayEl.focus();
        });

        reconnectBtn.addEventListener('click', () => {
            connect();
        });

        // Initial connection
        connect();
    </script>
</body>
</html>
